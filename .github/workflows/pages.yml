name: Website

# The website moved to https://valtrainer.github.io/ (repo Valtrainer/valtrainer.github.io). This publishes
# site-redirect/ at the old address https://idoraz1.github.io/ValTrainer/ so old links keep working.
on:
  push:
    branches: [main]
    paths:
      - "site-redirect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deploy that's in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the redirect to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site-redirect/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-redirect

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
