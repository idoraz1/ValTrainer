  @keyframes miss { 0%, 40% { opacity: 0; } 50%, 70% { opacity: 1; } 100% { opacity: 0; } }

    font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  a.btn::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: var(--red);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  a.btn:hover::before { background: var(--red-hover); }
  a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .links { margin-top: 1.5rem; font-size: .92rem; }
